name: Attach trait release files
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  assets:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Attach the versioned exports without overwriting existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ ! "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable version tag" >&2
            exit 1
          fi
          dir="versions/trait/$RELEASE"
          gh release upload "$RELEASE" --repo "$REPOSITORY" \
            "$dir/kpn_trait_collection.yaml" \
            "$dir/kpn_trait_flat.tsv" \
            "$dir/kpn_trait_registry.tsv" \
            "$dir/kpn_trait_mappings.sssom.tsv" \
            "$dir/kpn_trait_coverage.md"
